<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imago by Gorus</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      color: #111;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 1.6rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      padding: 0 5vw 5vw;
      max-width: 1600px;
      margin: 0 auto;
    }

    .gallery-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
      opacity: 0.95;
    }

    .caption {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: #555;
      text-transform: uppercase;
      text-align: center;
      transition: color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    .gallery-item:hover .caption {
      color: #000;
      opacity: 1;
      transform: translateY(0);
    }

    #about {
      padding: 6rem 10vw;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    #about h2 {
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    #about p {
      font-size: 1rem;
      line-height: 1.8;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 3rem 0;
      font-size: 0.85rem;
      color: #888;
    }

    footer a {
      color: #555;
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.3s;
    }

    footer a:hover {
      color: #000;
    }
  </style>
</head>
<body>
  <header>
    <h1>IMAGO BY GORUS</h1>
  </header>

  <section class="gallery" id="gallery"></section>

  <section id="about">
    <h2>About Me</h2>
    <p>
      Through my lens, I seek to capture stillness, emotion, and timeless beauty. 
      Each frame reflects not just a moment, but a feeling suspended in light.  
      Welcome to my visual journal — a collection of quiet stories told through form, tone, and silence.
    </p>
  </section>

  <footer>
    <p>
      <a href="https://instagram.com/imagobygorus" target="_blank">Instagram</a> |
      <a href="mailto:imagobygorus@gmail.com">Contact</a>
    </p>
  </footer>

  <script>
    const galleryData = [
      { id: 1, src: "IMG_39041.jpg", alt: "IMG_39041", caption: "Grace in motion" },
      { id: 2, src: "IMG_3912.jpg", alt: "IMG_3912", caption: "Light and silence" },
      { id: 3, src: "IMG_4101.jpg", alt: "IMG_4101", caption: "The soul of stillness" },
      { id: 4, src: "000000971.jpg", alt: "000000971", caption: "Timeless beauty" },
      { id: 5, src: "000000791.jpg", alt: "000000791", caption: "Moments suspended in light" },
      { id: 6, src: "000000801.jpg", alt: "000000801", caption: "Intimate elegance" },
      { id: 7, src: "2221.jpg", alt: "2221", caption: "Raw emotion" },
      { id: 8, src: "3331.jpg", alt: "3331", caption: "Beyond presence" },
      { id: 9, src: "4441.jpg", alt: "4441", caption: "Essence of quiet" }
    ];

    function renderGallery() {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";
      galleryData.forEach(item => {
        const div = document.createElement("div");
        div.classList.add("gallery-item");

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.alt;

        const caption = document.createElement("p");
        caption.classList.add("caption");
        caption.textContent = item.caption;

        div.appendChild(img);
        div.appendChild(caption);
        gallery.appendChild(div);
      });
    }

    renderGallery();
  </script>
</body>
</html>
