<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IMAGO BY GORUS | FINE ART GALLERY & WORKSHOPS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-light: #ffffff;
    --text-dark: #111111;
    --text-sub: #666666;
    --border-color: #e0e0e0;
  }

  *, *::before, *::after { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
  }

  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0; padding: 0;
    background: var(--bg-light);
    color: var(--text-dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; 
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* --- ZAŠTITA FOTOGRAFIJA --- */
  img {
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    pointer-events: none !important;
  }

  /* --- HEADER NAV --- */
  nav.header-nav {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 40px; z-index: 2000;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color);
  }
  .brand-logo-text {
    font-size: 0.85rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer; font-family: 'Montserrat', sans-serif; color: var(--text-dark);
  }
  .nav-links {
    display: flex; gap: 25px; align-items: center;
    text-transform: uppercase; font-size: 0.7rem;
    letter-spacing: 0.2em;
  }
  .nav-links div { cursor: pointer; transition: 0.3s; color: var(--text-dark); }
  .nav-links div:hover, .nav-links div.active { opacity: 0.5; }

  /* Dropdown Menu za Work */
  .dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .dropdown-label {
    cursor: pointer !important;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dropdown-arrow {
    font-size: 0.5rem;
    transition: transform 0.3s ease;
  }
  
  .dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(255, 255, 255, 0.98);
    min-width: 180px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.08);
    z-index: 2001;
    text-align: center;
    padding: 10px 0;
    border: 1px solid var(--border-color);
  }
  .dropdown-content a {
    color: var(--text-dark);
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: 0.2s;
    cursor: pointer;
  }
  .dropdown-content a:hover {
    opacity: 0.5;
    background: #f9f9f9;
  }

  @media(min-width: 851px) {
    .dropdown:hover .dropdown-content { display: block; }
  }
  .dropdown-content.show-dropdown { display: block !important; }

  /* --- PAGE SECTIONS --- */
  .page-section { display: none; min-height: 100vh; padding-top: 100px; }
  .page-section.active { display: block; }

  /* --- 1. HOME SECTION --- */
  .hero-landing {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 15px 60px; text-align: center;
  }
  .main-logo h1 { 
    font-weight: 200; font-size: clamp(1.2rem, 4vw, 3rem); 
    letter-spacing: 0.4em; margin: 0 0 30px 0; text-transform: uppercase; 
  }

  .triptych-grid { 
    display: flex; 
    gap: 10px; 
    max-width: 1100px; 
    width: 100%; 
    margin-bottom: 40px; 
    position: relative; 
  }
  .triptych-col { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    position: relative; 
  }
  .triptych-grid img { width: 100%; object-fit: cover; display: block; }
  .col-1 img, .col-2 img { height: 600px; }
  .col-3 img { height: 295px; }

  .hero-text h2 { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 400; font-size: clamp(0.9rem, 2.5vw, 1.8rem); margin: 0; }
  .hero-text p { font-size: 0.85rem; letter-spacing: 0.1em; color: var(--text-sub); margin-top: 5px; margin-bottom: 25px; }

  .btn-imago {
    font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.2em;
    padding: 12px 30px; border: 1px solid #111; color: #111; background: transparent; cursor: pointer; transition: 0.3s;
  }
  .btn-imago:hover { background: #111; color: #fff; }

  /* MEET THE CREATOR SEKCIJA */
  .meet-creator-wrapper {
    max-width: 1100px;
    margin: 80px auto 40px;
    padding: 0 20px;
    display: flex;
    gap: 50px;
    align-items: center;
    text-align: left;
  }
  .meet-creator-img {
    flex: 1;
    max-width: 500px;
    width: 100%;
    height: 550px;
    object-fit: cover;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
  }
  .meet-creator-info {
    flex: 1;
  }
  .meet-subtitle {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-sub);
    margin-bottom: 10px;
  }
  .meet-title {
    font-size: 2rem;
    font-weight: 200;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 0 0 20px 0;
  }
  .meet-desc {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    line-height: 1.8;
    color: var(--text-sub);
    margin-bottom: 30px;
  }

  /* --- PORTFOLIO OVERVIEW PAGE --- */
  .portfolio-banner {
    position: relative;
    width: 100%;
    height: 35vh;
    min-height: 200px;
    margin-bottom: 10px;
    cursor: pointer;
    overflow: hidden;
  }
  .portfolio-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease;
  }
  .portfolio-banner:hover img {
    transform: scale(1.03);
  }
  .portfolio-banner-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .portfolio-banner-overlay h2 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 200;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin: 0 0 10px 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .portfolio-banner-overlay span {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: underline;
    text-underline-offset: 5px;
    opacity: 0.9;
    transition: opacity 0.3s;
  }
  .portfolio-banner:hover .portfolio-banner-overlay span {
    opacity: 1;
  }

  /* --- 2. WORK / WILDLIFE SECTION --- */
  .catalog-section { background: #fff; padding: 10px 0 80px; text-align: center; }
  .category-title { 
    font-size: clamp(1.6rem, 3.5vw, 2.3rem); font-weight: 300; letter-spacing: 0.25em; 
    text-transform: uppercase; margin: 10px 0 15px 0; color: var(--text-dark); 
  }
  .category-subtitle {
    font-size: 0.7rem; letter-spacing: 0.15em; color: var(--text-sub); text-transform: uppercase;
    margin-bottom: 30px;
  }

  .full-photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 100%;
    padding: 0 15px;
  }

  .photo-card {
    position: relative;
    cursor: pointer;
    overflow: hidden;
    aspect-ratio: 4 / 3;
    background: #f4f4f4;
  }
  .photo-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    background: transparent;
  }
  .photo-card.room-card {
    aspect-ratio: 4 / 5;
  }
  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .photo-card:hover img { transform: scale(1.04); }

  /* --- 3. UNDER CONSTRUCTION SECTIONS (STREET & PORTRAITURE) --- */
  #sec-street, #sec-portraiture {
    padding-top: 0;
  }
  .construction-box {
    position: relative;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    min-height: 80vh; 
    padding: 0 20px; 
    text-align: center;
    overflow: hidden;
    color: #ffffff;
  }
  .construction-bg-img {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(12px);
    transform: scale(1.08);
    z-index: 1;
  }
  .construction-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 2;
  }
  .construction-content {
    position: relative;
    z-index: 3;
    max-width: 600px;
  }
  .construction-box h2 { 
    font-size: clamp(1.8rem, 4vw, 2.5rem); 
    font-weight: 200; 
    letter-spacing: 0.35em; 
    text-transform: uppercase; 
    margin-bottom: 15px; 
    color: #ffffff;
    text-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .construction-box p { 
    font-size: 0.85rem; 
    letter-spacing: 0.2em; 
    color: rgba(255, 255, 255, 0.85); 
    text-transform: uppercase; 
  }

  /* --- 4. WORKSHOPS SECTION --- */
  .expeditions-wrapper {
    max-width: 1100px; margin: 0 auto 80px; padding: 0 20px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .expeditions-hero-img { width: 100%; max-height: 500px; object-fit: cover; margin-bottom: 30px; }
  .expeditions-text { max-width: 800px; }
  .expeditions-text h2 { font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 200; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 20px; }
  .expeditions-text p { font-size: 0.85rem; letter-spacing: 0.08em; line-height: 1.8; color: var(--text-sub); text-transform: none; margin-bottom: 30px; }

  /* Tour Cards stilovi */
  .tour-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .tour-card
