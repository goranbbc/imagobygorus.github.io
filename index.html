<style>
  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0; padding: 0;
    background: #fafafa;
    color: #111;
    line-height: 1.7;
    overflow-x: hidden;
  }

  header {
    position: sticky;
    top:0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background:#fff;
    padding:20px 30px;
    border-bottom:1px solid #e5e5e5;
    z-index:100;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1 1 100%;
  }
  .logo img {
    height: 100px;
    width:auto;
    display:block;
  }
  .logo-text {
    text-align: center;
  }
  .logo-text h1 {
    margin: 0; font-size: 1.8rem; font-weight: 700; letter-spacing:0.1em;
  }
  .logo-text p {
    margin: 0; font-size: 0.9rem; font-weight: 300; letter-spacing:0.05em;
  }

  .header-buttons {
    display: flex;
    gap: 10px;
    flex: 1 1 100%;
    justify-content: center;
    margin-top: 10px;
  }
  .header-buttons button {
    font-weight:700;
    cursor:pointer;
    border:1px solid #111;
    padding:6px 12px;
    border-radius:4px;
    background:transparent;
    transition:0.3s;
    letter-spacing:0.1em;
  }
  .header-buttons button:hover { background:#111; color:#fff; }

  .gallery-title {
    text-align:center;
    font-weight:700;
    letter-spacing:0.15em;
    margin-top:60px;
    font-size:1.5rem;
    color:#555;
  }

  .gallery {
    max-width:1000px;
    margin:40px auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:5rem;
  }

  .gallery-item {
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    transform:translateY(40px);
    transition: opacity 1s ease-out, transform 1s ease-out;
    cursor:pointer;
  }

  .gallery-item.visible { opacity:1; transform:translateY(0); }

  .gallery-item img {
    width:100%;
    height:auto;
    border-radius:6px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.6s ease, opacity 0.6s ease;
  }
  .gallery-item img:hover { transform: scale(1.02); opacity:0.95; }

  .caption { font-size:1rem; color:#222; margin-top:1rem; font-weight:500; opacity:0.9; }
  .description { font-size:0.95rem; color:#555; max-width:700px; margin-top:0.5rem; line-height:1.8; text-align:justify; opacity:0.85; }

  footer { text-align:center; padding:2rem 0; font-size:0.85rem; color:#888; border-top:1px solid #e5e5e5; }
  footer a { color:#555; text-decoration:none; margin:0 10px; }
  footer a:hover { color:#000; }

  /* Lightbox overlay */
  .lightbox {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.95);
    display:none; justify-content:center; align-items:center;
    flex-direction:column; z-index:1000; padding:10px; overflow-y:auto;
  }
  .lightbox img { width:100%; max-width:1000px; height:auto; border-radius:6px; margin-bottom:1rem; }
  .lightbox .text { color:#fff; text-align:center; max-width:800px; font-size:1rem; line-height:1.6; padding:0 10px; }
  .lightbox .close { position:absolute; top:20px; right:30px; font-size:2rem; color:#fff; cursor:pointer; z-index:1010; }
  .lightbox .prev, .lightbox .next { position:absolute; top:50%; transform:translateY(-50%); font-size:3rem; color:#fff; cursor:pointer; user-select:none; z-index:1010; padding:0 15px; }
  .lightbox .prev { left:10px; } .lightbox .next { right:10px; }

  /* About Me modal */
  .about-modal {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center;
    padding:20px; z-index:1100; overflow-y:auto; color:#fff;
  }
  .about-modal .content {
    max-width:800px; 
    background:#111; 
    padding:30px; 
    border-radius:8px; 
    display:flex; 
    gap:20px; 
    flex-wrap:wrap;
    align-items:center;
  }
  .about-modal .content img {
    width:250px;
    height:auto;
    border-radius:6px;
  }
  .about-modal .text {
    flex:1;
    font-size:1rem;
    line-height:1.6;
  }
  .about-modal .close { position:absolute; top:20px; right:30px; font-size:2rem; cursor:pointer; }

  /* Responsive adjustments */
  @media (max-width:768px){
    .logo img { height:80px; }
    .logo-text h1 { font-size:1.5rem; }
    .logo-text p { font-size:0.85rem; }
    .header-buttons { flex-direction: column; margin-top: 10px; gap: 8px; }
    .about-modal .content { flex-direction: column; text-align: center; }
    .about-modal .content img { width:80%; max-width:300px; }
  }

  @media (max-width:480px){
    .logo img { height:70px; }
    .logo-text h1 { font-size:1.3rem; }
    .logo-text p { font-size:0.8rem; }
    .header-buttons button { padding:6px 10px; font-size:0.85rem; }
    .about-modal .text { font-size:0.95rem; }
  }
</style>
